<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Deals Dashboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="The important AI deals in one page: orders, investments and debt among the AI giants. AI 巨头订单、投资与债务一览。">
<style>
/* AI Orders & Debt dashboard. Same visual system as the live map (site/style.css): cool paper, one strong ink rule
   on top, quiet hairlines, colour reserved for money (order blue, investment aqua, debt orange, other financing slate).
   Layout: masthead, a row of totals, then what's new / what changed, the deals table, and the supporting panels. */
:root {
  color-scheme: light;
  --bg: #f3f5f8;
  --surface: #fdfdfe;
  --surface-2: #eaeef3;
  --ink: #0f141b;
  --ink-2: #4a5562;
  --muted: #5f6b78;
  --line: #cfd6df;
  --line-strong: #b4bdc8;
  --control-border: #858e9b;
  --accent: #1e48b8;
  --accent-ink: #ffffff;
  --accent-wash: #e3eafb;
  --focus: #1e48b8;
  --good: #0a7a37;
  --bad: #b42f2f;
  --new: #b45309;
  --grid: #e1e5eb;
  --scrim: rgba(15, 20, 27, .38);
  --shadow: 0 1px 2px rgba(15, 20, 27, .06), 0 12px 32px rgba(15, 20, 27, .14);
  --k-order: #2a78d6;
  --k-investment: #15936a;
  --k-debt: #e0602a;
  --k-other: #7d8794;
  --cds: #6250d6;
  --f-body: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Noto Sans SC", sans-serif;
  --f-mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --fs-xs: 11.5px; --fs-sm: 12.5px; --fs-base: 14.5px; --fs-md: 16px; --fs-lg: 19px;
  --fs-hero: clamp(38px, 5vw, 56px); --fs-kpi: clamp(24px, 2.4vw, 30px);
  --r: 8px; --r-sm: 4px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0c1015; --surface: #141920; --surface-2: #1c232c;
    --ink: #e9edf2; --ink-2: #b3bdc9; --muted: #8994a1;
    --line: #27303b; --line-strong: #3a4552; --control-border: #5f6b78;
    --accent: #7ea2ff; --accent-ink: #0c1015; --accent-wash: #1b2740; --focus: #9db8ff;
    --good: #2fc26a; --bad: #f06a6a; --new: #f59e0b; --grid: #222a34;
    --scrim: rgba(0, 0, 0, .55); --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 12px 32px rgba(0, 0, 0, .45);
    --k-order: #3987e5; --k-investment: #199e70; --k-debt: #e2672f; --k-other: #8a94a1; --cds: #9085e9;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0c1015; --surface: #141920; --surface-2: #1c232c;
  --ink: #e9edf2; --ink-2: #b3bdc9; --muted: #8994a1;
  --line: #27303b; --line-strong: #3a4552; --control-border: #5f6b78;
  --accent: #7ea2ff; --accent-ink: #0c1015; --accent-wash: #1b2740; --focus: #9db8ff;
  --good: #2fc26a; --bad: #f06a6a; --new: #f59e0b; --grid: #222a34;
  --scrim: rgba(0, 0, 0, .55); --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 12px 32px rgba(0, 0, 0, .45);
  --k-order: #3987e5; --k-investment: #199e70; --k-debt: #e2672f; --k-other: #8a94a1; --cds: #9085e9;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 400 var(--fs-base)/1.5 var(--f-body);
  border-top: 4px solid var(--ink);
}
[hidden] { display: none !important; }
a { color: var(--accent); text-underline-offset: 2px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.wrap {
  max-width: 1240px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.eyebrow { margin: 0; font-size: var(--fs-xs); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
:lang(zh) .eyebrow { letter-spacing: .02em; }

/* masthead */
.mast { padding-block: 20px 16px; border-bottom: 1px solid var(--line); background: var(--surface); }
.mast__in { display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: flex-end; justify-content: space-between; }
.mast__id { min-width: 0; flex: 1 1 420px; }
.mast h1 { margin: 4px 0 2px; font-size: clamp(24px, 3vw, 32px); line-height: 1.15; letter-spacing: -.01em; font-weight: 750; text-wrap: balance; }
.mast h1 .alt { font-weight: 500; color: var(--muted); font-size: .62em; letter-spacing: 0; margin-left: .4em; white-space: nowrap; }
.mast .sub { margin: 0; color: var(--ink-2); max-width: 64ch; }
.mast__tools { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
.asof { font-size: var(--fs-sm); color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
.asof .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); flex: none; }
.asof .dot.stale { background: var(--new); }
.seg { display: inline-flex; border: 1px solid var(--control-border); border-radius: 999px; padding: 2px; }
.seg button { border: 0; background: transparent; padding: 3px 11px; border-radius: 999px; cursor: pointer; font-size: var(--fs-sm); font-weight: 600; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.btn-link { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); text-decoration: none; font-size: var(--fs-sm); font-weight: 600; }
.btn-link:hover { filter: brightness(1.08); }

main { padding-block: 20px 8px; display: grid; gap: 20px; }

/* KPI row */
.kpis { display: grid; gap: 1px; grid-template-columns: 2fr repeat(4, 1fr); background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.kpi { background: var(--surface); padding: 14px 16px; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.kpi__label { font-size: var(--fs-sm); color: var(--ink-2); font-weight: 600; }
.kpi__value { font-size: var(--fs-kpi); font-weight: 750; line-height: 1.1; letter-spacing: -.01em; }
.kpi__value .u { font-size: .62em; font-weight: 650; margin-left: .06em; }
.kpi__note { font-size: var(--fs-xs); color: var(--muted); }
.kpi--hero .kpi__value { font-size: var(--fs-hero); letter-spacing: -.02em; }
.split { display: flex; height: 8px; gap: 2px; margin-top: 6px; }
.split span { display: block; height: 100%; border-radius: 999px; min-width: 2px; }
.split .a { background: var(--ink); }
.split .b { background: var(--line-strong); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: var(--fs-sm); color: var(--ink-2); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.kpi--hero .broad { font-size: var(--fs-xs); color: var(--muted); margin-top: 2px; }
.kpi--cont .kpi__value { color: var(--ink-2); }
.tagline { display: inline-block; align-self: flex-start; font-size: 10.5px; font-weight: 650; letter-spacing: .03em; padding: 1px 7px; border-radius: 999px; border: 1px dashed var(--control-border); color: var(--ink-2); }

/* cards */
.grid2 { display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.grid75 { display: grid; gap: 20px; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); align-items: start; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; }
.card__head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; margin-bottom: 10px; }
.card h2 { margin: 0; font-size: var(--fs-lg); line-height: 1.25; font-weight: 700; text-wrap: balance; }
.card h3 { margin: 18px 0 8px; font-size: var(--fs-md); font-weight: 700; }
.card__sub { margin: 2px 0 0; font-size: var(--fs-sm); color: var(--muted); max-width: 70ch; }
.empty { color: var(--muted); font-size: var(--fs-sm); padding: 12px 0; margin: 0; }
.more { margin-top: 8px; border: 0; background: none; color: var(--accent); cursor: pointer; padding: 4px 0; font-size: var(--fs-sm); font-weight: 600; }

/* feed lists */
.feed { list-style: none; margin: 0; padding: 0; }
.feed li + li { border-top: 1px solid var(--line); }
.feed__btn { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 2px 10px; width: 100%; text-align: left; background: none; border: 0; padding: 9px 4px; cursor: pointer; border-radius: var(--r-sm); }
.feed__btn:hover { background: var(--surface-2); }
.feed__btn[disabled] { cursor: default; }
.feed__btn[disabled]:hover { background: none; }
.kdot { width: 10px; height: 10px; border-radius: 50%; margin-top: 6px; background: var(--k-other); flex: none; }
.kdot--guarantee { background: transparent; border: 2px solid var(--k-other); }
.feed__title { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.feed__meta { grid-column: 2 / 4; font-size: var(--fs-sm); color: var(--muted); overflow-wrap: anywhere; }
.feed__amt { font-weight: 700; white-space: nowrap; text-align: right; }
.diff { display: block; color: var(--ink-2); }
.diff b { font-weight: 600; color: var(--ink-2); }
.diff .to { color: var(--ink); font-weight: 600; }

/* deals table */
.toolbar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin-bottom: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--control-border); background: var(--surface); border-radius: 999px; padding: 3px 10px; cursor: pointer; font-size: var(--fs-sm); color: var(--ink-2); }
.chip:hover { border-color: var(--ink-2); }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.chip .n { color: inherit; opacity: .7; font-variant-numeric: tabular-nums; }
.chip .kdot { margin: 0; width: 8px; height: 8px; }
.chip--co { background: var(--accent-wash); border-color: var(--accent); color: var(--ink); font-weight: 600; }
.search { flex: 1 1 220px; min-width: 0; max-width: 340px; display: flex; }
.search input { width: 100%; min-width: 0; font: inherit; font-size: var(--fs-sm); padding: 6px 12px; border-radius: 999px; border: 1px solid var(--control-border); background: var(--surface); color: var(--ink); }
.tablewrap { overflow-x: auto; border-top: 1px solid var(--line-strong); }
table { width: 100%; border-collapse: collapse; font-size: var(--fs-sm); }
th { text-align: left; font-weight: 600; color: var(--muted); font-size: var(--fs-xs); padding: 8px 8px; border-bottom: 1px solid var(--line-strong); white-space: nowrap; vertical-align: bottom; }
th button { border: 0; background: none; padding: 0; cursor: pointer; font-weight: 600; color: var(--muted); font-size: inherit; display: inline-flex; gap: 4px; align-items: center; }
th button:hover, th[aria-sort] button { color: var(--ink); }
th .arr { font-size: 9px; width: 8px; }
td { padding: 9px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
tbody tr { cursor: pointer; }
tbody tr:hover td { background: var(--surface-2); }
tbody tr.sel td { background: var(--accent-wash); }
.c-amt { text-align: right; white-space: nowrap; font-weight: 700; font-variant-numeric: tabular-nums; }
th.c-amt { text-align: right; }
th.c-amt button { flex-direction: row-reverse; }
.c-date { white-space: nowrap; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.c-party { min-width: 110px; max-width: 180px; }
.c-deal { min-width: 220px; }
.c-deal .t { font-weight: 600; color: var(--ink); }
.c-deal .p, .c-deal .m { display: none; color: var(--muted); margin-top: 2px; }
.kindcell { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.kindcell .kdot { margin: 0; }
.undis { color: var(--muted); font-weight: 500; }
.small { display: block; font-size: var(--fs-xs); font-weight: 500; color: var(--muted); }
.pill { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; font-size: var(--fs-xs); font-weight: 600; color: var(--ink-2); }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid var(--ink-2); }
.pill.bind::before { background: var(--ink-2); }
.badge { display: inline-flex; align-items: center; gap: 5px; font-size: var(--fs-xs); font-weight: 650; padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
.badge--confirmed { background: var(--ink); color: var(--surface); }
.badge--reported { border: 1px solid var(--control-border); color: var(--ink-2); }
.tblfoot { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; margin-top: 10px; font-size: var(--fs-sm); color: var(--muted); }
.btn { border: 1px solid var(--control-border); background: var(--surface); border-radius: 999px; padding: 5px 14px; cursor: pointer; font-size: var(--fs-sm); font-weight: 600; color: var(--ink); }
.btn:hover { border-color: var(--ink-2); }

/* timeline */
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--f-body); font-variant-numeric: tabular-nums; }
.tip { position: absolute; z-index: 5; pointer-events: none; background: var(--surface); color: var(--ink); border: 1px solid var(--line-strong); border-radius: var(--r-sm); box-shadow: var(--shadow); padding: 8px 10px; font-size: var(--fs-sm); min-width: 190px; max-width: 270px; }
.tip b { display: block; margin-bottom: 2px; }
.tip .row { display: flex; justify-content: space-between; gap: 12px; color: var(--ink-2); }
.tip .row i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; }
.chart details, .foot details { margin-top: 10px; font-size: var(--fs-sm); }
summary { cursor: pointer; color: var(--accent); font-weight: 600; }
.mini { width: 100%; font-size: var(--fs-xs); margin-top: 8px; }
.mini td, .mini th { padding: 4px 6px; }
.mini td:not(:first-child), .mini th:not(:first-child) { text-align: right; }

/* companies */
.co { display: grid; gap: 0; }
.co__head, .co__row { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) minmax(0, 1fr) auto 92px; gap: 0 10px; align-items: center; }
.co__head { font-size: var(--fs-xs); color: var(--muted); font-weight: 600; padding: 0 4px 6px; border-bottom: 1px solid var(--line-strong); }
.co__head .r, .co__row .r { text-align: right; }
.co__bor { white-space: nowrap; min-width: 64px; }
.co__row { width: 100%; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; padding: 7px 4px; cursor: pointer; font-size: var(--fs-sm); }
.co__row:hover { background: var(--surface-2); }
.co__row[aria-pressed="true"] { background: var(--accent-wash); }
.co__name { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.co__name .g { display: block; font-weight: 400; font-size: var(--fs-xs); color: var(--muted); }
.bar { display: flex; align-items: center; gap: 6px; min-width: 0; font-size: var(--fs-xs); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.bar .tk { flex: 1 1 auto; min-width: 0; display: flex; }
.bar .v { flex: none; min-width: 4.6em; white-space: nowrap; }
:lang(zh) .bar .v { min-width: 6.2em; }
.bar .f { height: 10px; border-radius: 0 4px 4px 0; flex: none; }
.bar--out, .bar--out .tk { flex-direction: row-reverse; }
.bar--out .v { text-align: right; }
.bar--out .f { border-radius: 4px 0 0 4px; background: var(--ink-2); }
.bar--in .f { background: var(--accent); }
.co__cds { font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
.up { color: var(--bad); font-size: var(--fs-xs); }
.down { color: var(--good); font-size: var(--fs-xs); }

/* debt + cds */
.figs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; }
.fig__v { font-size: 22px; font-weight: 750; line-height: 1.15; }
.fig__l { font-size: var(--fs-xs); color: var(--muted); }
.hbars { display: grid; gap: 6px; }
.hbar { display: grid; grid-template-columns: minmax(80px, 34%) minmax(0, 1fr); gap: 10px; align-items: center; font-size: var(--fs-sm); }
.hbar .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hbar .tr { display: flex; align-items: center; gap: 6px; min-width: 0; font-size: var(--fs-xs); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.hbar .tr .f { height: 10px; border-radius: 0 4px 4px 0; flex: none; min-width: 2px; }
.hbar .tr .v { min-width: 0; }
.hbar--debt .f { background: var(--k-debt); }
.hbar--cds .f { background: var(--cds); }
.hbar .sub { display: block; font-size: var(--fs-xs); color: var(--muted); }

/* loops */
.loops { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 360px), 1fr)); }
.loop { border: 1px solid var(--line); border-radius: var(--r); padding: 12px; min-width: 0; background: var(--surface); }
.loop__h { display: flex; justify-content: space-between; gap: 8px; font-size: var(--fs-xs); color: var(--muted); font-weight: 600; margin-bottom: 8px; flex-wrap: wrap; }
.loop__chain { font-weight: 650; margin: 0 0 8px; overflow-wrap: anywhere; }
.leg { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 12px; width: 100%; border: 0; border-top: 1px solid var(--line); background: none; text-align: left; padding: 6px 4px; cursor: pointer; font-size: var(--fs-sm); color: var(--ink); }
.leg:hover { background: var(--surface-2); }
.leg[disabled] { cursor: default; }
.leg[disabled]:hover { background: none; }
.leg .k { grid-column: 1 / -1; font-size: var(--fs-xs); color: var(--muted); }
.leg .amt { font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }

/* footer */
.foot { padding-block: 24px 40px; color: var(--ink-2); font-size: var(--fs-sm); display: grid; gap: 10px; border-top: 1px solid var(--line); margin-top: 12px; }
.foot p { margin: 0; max-width: 80ch; }
.foot .disc { font-weight: 600; color: var(--ink); }
.foot details p { margin-top: 6px; color: var(--ink-2); }
.cite { font-family: var(--f-mono); font-size: var(--fs-xs); background: var(--surface-2); padding: 2px 6px; border-radius: 3px; overflow-wrap: anywhere; }
:lang(zh) .cite { font-family: var(--f-body); }

/* drawer */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 20; }
.drawer {
  position: fixed; z-index: 21; top: 0; right: 0; bottom: 0; width: min(460px, 100%);
  background: var(--surface); box-shadow: var(--shadow); border-left: 1px solid var(--line);
  overflow-y: auto; overscroll-behavior: contain;
  padding: calc(16px + env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) 20px;
}
.drawer__close { position: sticky; top: 0; float: right; border: 1px solid var(--control-border); background: var(--surface); border-radius: 999px; width: 32px; height: 32px; cursor: pointer; font-size: 18px; line-height: 1; }
.drawer h2 { margin: 6px 0 12px; font-size: 21px; line-height: 1.25; text-wrap: balance; padding-right: 40px; }
.parties { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 8px; align-items: center; margin: 12px 0; }
.party { border: 1px solid var(--line); border-radius: var(--r-sm); padding: 8px 10px; min-width: 0; }
.party .r { font-size: var(--fs-xs); color: var(--muted); display: block; }
.party .n { font-weight: 650; overflow-wrap: anywhere; }
.parties .ar { color: var(--muted); font-size: 18px; }
.d-amt { font-size: 32px; font-weight: 750; line-height: 1.1; margin: 4px 0; }
.dl { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 16px; margin: 14px 0; font-size: var(--fs-sm); }
.dl dt { color: var(--muted); }
.dl dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.d-sum { margin: 12px 0; line-height: 1.6; }
.d-text { font-size: var(--fs-sm); color: var(--ink-2); background: var(--surface-2); border-radius: var(--r-sm); padding: 8px 10px; overflow-wrap: anywhere; }
.d-note { font-size: var(--fs-sm); color: var(--ink-2); border-left: 3px solid var(--line-strong); padding-left: 10px; margin: 8px 0; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.tag { font-size: var(--fs-xs); font-weight: 600; padding: 1px 8px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); }
.tag--new { background: var(--new); color: var(--surface); }

.nodata { text-align: center; padding: 56px 16px; }
.nodata h2 { font-size: 22px; margin: 0 0 8px; }
.nodata p { color: var(--ink-2); max-width: 56ch; margin: 0 auto 16px; }

@media (max-width: 1080px) {
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpi--hero { grid-column: 1 / -1; }
  .grid75 { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 760px) {
  .grid2 { grid-template-columns: minmax(0, 1fr); }
  .mast h1 .alt { display: block; margin: 2px 0 0; }
  .c-party, .c-kind, .c-status { display: none; }
  .c-deal { min-width: 0; }
  .c-deal .p, .c-deal .m { display: block; }
  .c-date { white-space: normal; width: 64px; }
  .co__head { display: none; }
  .co__row { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-areas: "n n" "o i" "b c"; gap: 4px 10px; padding: 10px 4px; }
  .co__name { grid-area: n; white-space: normal; }
  .co__name .g { display: inline; margin-left: 6px; }
  .bar--out { grid-area: o; } .bar--in { grid-area: i; }
  .co__bor { grid-area: b; text-align: left !important; font-size: var(--fs-xs); color: var(--muted); }
  .co__cds { grid-area: c; font-size: var(--fs-xs); }
  .co__bor::before { content: attr(data-l) " "; }
  .co__cds::before { content: attr(data-l) " "; color: var(--muted); }
  .drawer { top: auto; width: 100%; max-height: 88vh; border-left: 0; border-top: 1px solid var(--line); border-radius: 14px 14px 0 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .parties { grid-template-columns: minmax(0, 1fr); }
  .parties .ar { transform: rotate(90deg); justify-self: center; }
}
@media (max-width: 420px) {
  .kpi { padding: 12px; }
  .kpi__value { font-size: 22px; }
}
@media (prefers-reduced-motion: no-preference) {
  .drawer { animation: slide .18s ease-out; }
  @keyframes slide { from { transform: translateX(24px); opacity: .6; } to { transform: none; opacity: 1; } }
}
@media (forced-colors: active) {
  .split span, .bar .f, .hbar .f, .kdot { forced-color-adjust: none; border: 1px solid CanvasText; }
}
</style>

      else row(T("d_src"), lbl);
    }
    row(T("d_id"), el("span", "cite", d.id));
    add(dr, dl);
    var tags = arr(d.tags);
    if (tags.length) {
      var tg = el("div", "tags");
      tags.forEach(function (t) { add(tg, el("span", "tag" + (t === "new" ? " tag--new" : ""), (STR[state.lang].tags[t]) || t)); });
      add(dr, tg);
    }
    var lm = el("a", null, T("d_map")); lm.href = safeUrl(D.live_url) || DEFAULT_LIVE; lm.target = "_blank"; lm.rel = "noopener";
    var lp = el("p"); lp.style.marginTop = "18px"; add(lp, lm); add(dr, lp);
    dr.hidden = false; document.getElementById("scrim").hidden = false;
    Array.prototype.forEach.call(document.querySelectorAll("#deal-table tbody tr"), function (r) { r.className = r.dataset.id === id ? "sel" : ""; });
    x.focus();
  }
  function closeDrawer() {
    state.drawer = null;
    document.getElementById("drawer").hidden = true; document.getElementById("scrim").hidden = true;
    Array.prototype.forEach.call(document.querySelectorAll("#deal-table tbody tr.sel"), function (r) { r.className = ""; });
    var f = state.lastFocus; state.lastFocus = null;
    if (f && document.body.contains(f)) f.focus();
  }
  document.getElementById("scrim").addEventListener("click", closeDrawer);
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && state.drawer) closeDrawer();
    if (e.key === "Tab" && state.drawer) {
      var f = document.getElementById("drawer").querySelectorAll("a[href], button");
      if (!f.length) return;
      var first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });

  /* ---------------------------------------------------------------- page */
  function renderNoData(main) {
    var c = el("section", "card nodata");
    var a = el("a", "btn-link", T("live")); a.href = DEFAULT_LIVE; a.target = "_blank"; a.rel = "noopener";
    add(c, el("h2", null, T("nodata_h")), el("p", null, T("nodata_p")), a);
    add(main, c);
  }
  function render() {
    renderHeader();
    var main = clear(document.getElementById("main"));
    try {
      if (!D || typeof D !== "object" || !Array.isArray(D.deals)) renderNoData(main);
      else {
        renderKpis(main);
        var g = el("div", "grid2"); renderNew(g); renderChanges(g); add(main, g);
        renderDeals(main);
        renderTimeline(main);
        var g2 = el("div", "grid75"); renderCompanies(g2); renderDebt(g2); add(main, g2);
        renderLoops(main);
      }
    } catch (err) {
      if (window.console) console.error(err);
      clear(main); renderNoData(main);
    }
    renderFoot();
    if (state.drawer && BYID[state.drawer]) openDrawer(state.drawer); else if (state.drawer) closeDrawer();
  }
  function setLang(l) { if (l === state.lang) return; state.lang = l; store.set(LS_LANG, l); render(); focusId("lang-" + l); }
  document.getElementById("lang-en").addEventListener("click", function () { setLang("en"); });
  document.getElementById("lang-zh").addEventListener("click", function () { setLang("zh"); });
  var rt = null, lastW = 0;
  window.addEventListener("resize", function () {
    clearTimeout(rt);
    rt = setTimeout(function () { var b = document.getElementById("tl-chart"); if (b && b.clientWidth !== lastW) { lastW = b.clientWidth; drawTimeline(); } }, 120);
  });
  prep();
  render();
  var tlb = document.getElementById("tl-chart"); if (tlb) lastW = tlb.clientWidth;
})();
</script>
